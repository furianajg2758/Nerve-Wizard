default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5

development:
  <<: *default
  database: nerve_wizard_development

test:
  <<: *default
  database: nerve_wizard_test

production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

  cable:
    <<: *primary_production
  cache:
    <<: *primary_production
  queue:
    <<: *primary_production